[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "specsops"
version = "0.1.0"
description = "Verificador de força de senhas com checagem de hashes vazados"
readme = "README.md"
requires-python = ">=3.9"

[project.scripts]
specsops = "specsops.cli:main"

[tool.setuptools]
packages = ["specsops", "specsops.data"]

[tool.setuptools.package-data]
"specsops.data" = ["*.txt"]
